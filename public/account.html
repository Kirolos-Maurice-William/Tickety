<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account &amp; Session — Tickety</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container two-col-page">
    <section>
      <span class="eyebrow">Active Session</span>
      <h1 id="account-heading" class="section-title" style="margin-bottom: 1rem;">Guest Session</h1>
      <p id="account-mode-note" class="lead" style="font-size: 1.02rem; margin-bottom: 1.75rem;"></p>

      <form id="profile-form" class="form-stack" style="max-width: 460px;">
        <div class="field">
          <label class="field-label" for="profile-name">Full Name</label>
          <input id="profile-name" class="input" type="text" required />
        </div>
        <div class="field">
          <label class="field-label" for="profile-email">Email Address</label>
          <input id="profile-email" class="input" type="email" placeholder="Optional in Guest Mode" />
        </div>
        <div class="field">
          <label class="field-label" for="profile-phone">Phone Number</label>
          <input id="profile-phone" class="input" type="tel" placeholder="+20 ..." />
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; padding-top: 0.35rem;">
          <button type="submit" class="btn btn-primary">Save Details</button>
          <button type="button" id="new-guest-btn" class="btn btn-ghost">New Guest Session</button>
        </div>
      </form>
    </section>

    <section>
      <span class="eyebrow">Permanent Account (Optional)</span>
      <h2 class="section-title" style="margin-bottom: 1rem;">Sign In or Register</h2>
      <p style="color: var(--charcoal); margin-bottom: 1.5rem;">
        Guest mode lets you explore and book immediately. If you register below, your current guest reservations are automatically transferred to your permanent account.
      </p>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
        <button type="button" id="tab-register" class="btn btn-dark" style="padding: 0.55rem 1.25rem;">Create Account</button>
        <button type="button" id="tab-login" class="btn btn-ghost" style="padding: 0.55rem 1.25rem;">Sign In</button>
      </div>

      <form id="register-form" class="form-stack" style="max-width: 460px;">
        <div class="field">
          <label class="field-label" for="reg-name">Full Name</label>
          <input id="reg-name" class="input" type="text" required />
        </div>
        <div class="field">
          <label class="field-label" for="reg-email">Email Address</label>
          <input id="reg-email" class="input" type="email" required />
        </div>
        <div class="field">
          <label class="field-label" for="reg-password">Password (minimum 6 characters)</label>
          <input id="reg-password" class="input" type="password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary">Create Account &amp; Keep Tickets</button>
      </form>

      <form id="login-form" class="form-stack" style="max-width: 460px; display: none;">
        <div class="field">
          <label class="field-label" for="login-email">Email Address</label>
          <input id="login-email" class="input" type="email" required />
        </div>
        <div class="field">
          <label class="field-label" for="login-password">Password</label>
          <input id="login-password" class="input" type="password" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/js/shell.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
